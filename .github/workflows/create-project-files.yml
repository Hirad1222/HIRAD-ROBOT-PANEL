
name: Create HIRAD ROBOT PANEL Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project files
        shell: bash
        run: |
          mkdir -p backend

          cat > backend/main.py <<'PY'
          import os
          import secrets

          from dotenv import load_dotenv
          load_dotenv()

          from fastapi import FastAPI, Depends, HTTPException
          from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials
          from fastapi.middleware.cors import CORSMiddleware
          from pydantic import BaseModel, Field

          from database import (
              init_db,
              get_group_settings,
              save_group_settings,
              get_group_count
          )

          APP_VERSION = "2.1.0"
          PANEL_API_KEY = os.getenv("PANEL_API_KEY", "")

          ALLOWED_ORIGINS = [
              x.strip()
              for x in os.getenv(
                  "ALLOWED_ORIGINS",
                  "https://hirad1222.github.io"
              ).split(",")
              if x.strip()
          ]

          app = FastAPI(
              title="HIRAD ROBOT PANEL API",
              version=APP_VERSION
          )

          app.add_middleware(
              CORSMiddleware,
              allow_origins=ALLOWED_ORIGINS,
              allow_credentials=False,
              allow_methods=["GET", "PUT", "OPTIONS"],
              allow_headers=["Authorization", "Content-Type"]
          )

          security = HTTPBearer(auto_error=False)

          @app.on_event("startup")
          def startup():
              init_db()

          def require_panel_key(
              credentials: HTTPAuthorizationCredentials =
              Depends(security)
          ):
              if not PANEL_API_KEY or len(PANEL_API_KEY) < 32:
                  raise HTTPException(
                      status_code=503,
                      detail="Panel authentication is not configured."
                  )

              if not credentials:
                  raise HTTPException(
                      status_code=401,
                      detail="Authentication required"
                  )

              if not secrets.compare_digest(
                  credentials.credentials,
                  PANEL_API_KEY
              ):
                  raise HTTPException(
                      status_code=401,
                      detail="Invalid panel key"
                  )

              return True

          class GroupSettings(BaseModel):
              settings: dict = Field(default_factory=dict)

          @app.get("/")
          def root():
              return {
                  "name": "HIRAD ROBOT PANEL",
                  "version": APP_VERSION,
                  "status": "running"
              }

          @app.get("/api/health")
          def health():
              return {
                  "status": "ok",
                  "service": "hirad-backend",
                  "version": APP_VERSION
              }

          @app.get("/api/summary")
          def summary(auth=Depends(require_panel_key)):
              return {
                  "groups": get_group_count(),
                  "violations": 0,
                  "messages_checked": 0,
                  "rubika_connected": False,
                  "integration_status": "not_configured"
              }

          @app.get("/api/groups")
          def groups(auth=Depends(require_panel_key)):
              return {
                  "groups": [],
                  "integration_status": "not_configured"
              }

          @app.get("/api/groups/{group_id}/settings")
          def read_settings(
              group_id: str,
              auth=Depends(require_panel_key)
          ):
              if not group_id or len(group_id) > 200:
                  raise HTTPException(
                      status_code=400,
                      detail="Invalid group ID"
                  )

              return {
                  "group_id": group_id,
                  "settings": get_group_settings(group_id)
              }

          @app.put("/api/groups/{group_id}/settings")
          def write_settings(
              group_id: str,
              body: GroupSettings,
              auth=Depends(require_panel_key)
          ):
              if not group_id or len(group_id) > 200:
                  raise HTTPException(
                      status_code=400,
                      detail="Invalid group ID"
                  )

              if len(str(body.settings)) > 30000:
                  raise HTTPException(
                      status_code=413,
                      detail="Settings are too large"
                  )

              save_group_settings(group_id, body.settings)

              return {
                  "success": True,
                  "group_id": group_id,
                  "settings": body.settings
              }
          PY

          cat > backend/database.py <<'PY'
          import os
          import json
          import sqlite3

          BASE_DIR = os.path.dirname(os.path.abspath(__file__))
          DATA_DIR = os.path.join(BASE_DIR, "data")
          DB_PATH = os.path.join(DATA_DIR, "hirad.db")

          def connect():
              os.makedirs(DATA_DIR, exist_ok=True)
              db = sqlite3.connect(DB_PATH)
              db.row_factory = sqlite3.Row
              return db

          def init_db():
              with connect() as db:
                  db.execute("""
                      CREATE TABLE IF NOT EXISTS group_settings (
                          group_id TEXT PRIMARY KEY,
                          settings_json TEXT NOT NULL,
                          updated_at TEXT NOT NULL
                              DEFAULT CURRENT_TIMESTAMP
                      )
                  """)

          def get_group_settings(group_id):
              with connect() as db:
                  row = db.execute(
                      """
                      SELECT settings_json
                      FROM group_settings
                      WHERE group_id = ?
                      """,
                      (group_id,)
                  ).fetchone()

              if not row:
                  return {}

              try:
                  return json.loads(row["settings_json"])
              except (json.JSONDecodeError, TypeError):
                  return {}

          def save_group_settings(group_id, settings):
              payload = json.dumps(
                  settings,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              with connect() as db:
                  db.execute("""
                      INSERT INTO group_settings (
                          group_id,
                          settings_json,
                          updated_at
                      )
                      VALUES (?, ?, CURRENT_TIMESTAMP)

                      ON CONFLICT(group_id) DO UPDATE SET
                          settings_json = excluded.settings_json,
                          updated_at = CURRENT_TIMESTAMP
                  """, (group_id, payload))

          def get_group_count():
              with connect() as db:
                  row = db.execute(
                      "SELECT COUNT(*) AS total FROM group_settings"
                  ).fetchone()

              return row["total"]
          PY

          cat > backend/requirements.txt <<'TXT'
          fastapi>=0.115,<1.0
          uvicorn[standard]>=0.30,<1.0
          python-dotenv>=1.0,<2.0
          TXT

          cat > backend/.env.example <<'ENV'
          PANEL_API_KEY=REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARS
          ALLOWED_ORIGINS=https://hirad1222.github.io
          ENV

          cat > .gitignore <<'GIT'
          .env
          .env.*
          !.env.example
          __pycache__/
          *.py[cod]
          *.db
          *.sqlite
          *.sqlite3
          backend/data/
          .venv/
          venv/
          .DS_Store
          GIT

          echo "HIRAD ROBOT PANEL files created."

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/main.py
          git add backend/database.py
          git add backend/requirements.txt
          git add backend/.env.example
          git add .gitignore

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create HIRAD ROBOT PANEL backend"
            git push
          fi
          
